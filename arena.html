<!DOCTYPE html>
<html>
<head>
<title>Arena Survival</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="crosshair-system.js"></script>
<script src="firebase-leaderboard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {overflow:hidden;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);font-family:'Segoe UI',sans-serif;color:white;}
#menu {
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center;padding:20px;
}
h1 {font-size:3em;color:#00ff88;text-shadow:0 0 30px #00ff88;margin-bottom:30px;}
.btn-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px;max-width:800px;width:100%;}
.game-btn {padding:25px 20px;background:linear-gradient(145deg,#1a1a2e,#0f0f1a);border:3px solid #333;border-radius:15px;cursor:pointer;transition:all 0.3s;font-size:1.4em;font-weight:bold;}
.game-btn.normal {border-color:#00ff88;color:#00ff88;}
.game-btn.ranked {border-color:#ff4444;color:#ff4444;}
.game-btn:hover {transform:translateY(-10px);box-shadow:0 20px 40px rgba(0,255,136,0.3);}
#leaderboard {position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.95);padding:25px;border-radius:20px;max-width:90%;max-height:200px;overflow-y:auto;border:2px solid #ff4444;}
.lb-title {font-size:1.5em;color:#ff4444;margin-bottom:15px;text-align:center;font-weight:bold;}
.lb-row {padding:12px;border-bottom:1px solid #444;display:flex;justify-content:space-between;font-size:1.1em;}
.lb-row.me {background:rgba(255,68,68,0.2);border-left:4px solid #ff4444;}
.lb-row:hover {background:rgba(255,68,68,0.1);}
#game-ui {position:fixed;top:20px;left:20px;background:rgba(0,0,0,0.8);padding:20px;border-radius:15px;display:none;z-index:50;}
#gameover {position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);padding:40px;border-radius:20px;text-align:center;display:none;z-index:200;border:3px solid #ff4444;}
.gameover-title {font-size:3em;color:#ff4444;margin-bottom:20px;}
.stat-grid {display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0;}
.stat {font-size:2em;font-weight:bold;}
.normal .stat {color:#00ff88;}
.ranked .stat {color:#ff4444;}
.restart-btn {padding:15px 40px;font-size:1.2em;background:#00ff88;color:black;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:20px;}
#renderer {position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
@media (max-width:768px) {.btn-grid {grid-template-columns:1fr;gap:20px;}}
</style>
</head>
<body>
<div id="menu">
  <h1>🏟️ ARENA SURVIVAL</h1>
  <p style="color:#888;margin-bottom:40px;font-size:1.2em;">Survive endless waves of enemies</p>
  <div class="btn-grid">
    <div class="game-btn normal" onclick="startGame('normal')">
      🟢 NORMAL MODE<br>
      <small>Slower enemies - Practice</small>
    </div>
    <div class="game-btn ranked" onclick="startGame('ranked')">
      🔴 RANKED MODE<br>
      <small>Faster enemies - Leaderboard</small>
    </div>
  </div>
</div>

<div id="leaderboard">
  <div class="lb-title">🏆 TOP 5 WAVES SURVIVED</div>
  <div id="lb-list">Loading...</div>
</div>

<div id="game-ui">
  <div>WAVE: <span id="wave-display">1</span></div>
  <div>KILLS: <span id="kill-display">0</span></div>
</div>

<div id="gameover" class="gameover">
  <div id="gameover-title" class="gameover-title">GAME OVER</div>
  <div class="stat-grid">
    <div class="stat"><span id="final-wave">1</span> WAVES</div>
    <div class="stat"><span id="final-kills">0</span> KILLS</div>
  </div>
  <button class="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
</div>

<div id="renderer"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode');
  if (mode === 'normal' || mode === 'ranked') {
    gameMode = mode;
    // Hide menu and show game UI, request pointer lock
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game-ui').style.display = 'flex';
    document.getElementById('gameover-title').textContent = mode.toUpperCase() + ' MODE';
    document.querySelector('.gameover').className = `gameover ${mode}`;
    renderer.domElement.requestPointerLock();
  }
});

let scene, camera, renderer, humanoidMeshes = [], wave = 1, kills = 0, gameActive = false, pointerLocked = false, gameMode = 'normal', maxWave = 0;
let currentSpeed, currentColor;
const spawnRadius = 8, reachDistance = 2.5;

initFirebaseLeaderboard();
loadTopScores();
setInterval(() => loadTopScores(), 300000); // Update leaderboard every 5 minutes

function showMenu() {
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('game-ui').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
  gameActive = false;
  if (renderer) renderer.domElement.style.cursor = 'default';
}

function startGame(mode) {
  gameMode = mode;
  maxWave = 0;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game-ui').style.display = 'flex';
  renderer.domElement.requestPointerLock();
  document.getElementById('gameover-title').textContent = `${mode.toUpperCase()} OVER`;
  document.querySelector('.gameover').className = `gameover ${mode}`;
}

function lockChange() {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  if (pointerLocked) {
    wave = 1;
    kills = 0;
    spawnWave();
    gameActive = true;
    updateUI();
  } else {
    if (gameActive) {
      const wavesSurvived = wave - 1;
      maxWave = Math.max(maxWave, wavesSurvived);
      if (gameMode === 'ranked') submitScore('arena-ranked', wavesSurvived);
      showGameOver(wavesSurvived);
    }
  }
}

function showGameOver(wavesSurvived) {
  gameActive = false;
  document.getElementById('final-wave').textContent = wavesSurvived;
  document.getElementById('final-kills').textContent = kills;
  document.getElementById('gameover').style.display = 'block';
  renderer.domElement.style.cursor = 'default';
}

function restartGame() {
  document.getElementById('gameover').style.display = 'none';
  renderer.domElement.requestPointerLock();
}

function updateUI() {
  document.getElementById('wave-display').textContent = wave;
  document.getElementById('kill-display').textContent = kills;
}

async function loadTopScores() {
  const scores = await getTopScores('arena-ranked', 5);
  const lbList = document.getElementById('lb-list');
  if (scores.length === 0) {
    lbList.innerHTML = '<div style="color:#888;padding:20px;">No records yet</div>';
  } else {
    lbList.innerHTML = scores.map((s,i) => `<div class="lb-row ${s.isMe ? 'me' : ''}">
      ${i+1}. ${s.username}: <strong>${s.score}</strong> waves
    </div>`).join('');
  }
}

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);
  
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.id = 'renderer';
  document.body.appendChild(renderer.domElement);
  
  // Floor/Grid
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshLambertMaterial({color:0x333333}));
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);
  scene.add(new THREE.GridHelper(100,50,0x444444,0x222222));
  
  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(0,20,10);
  dirLight.castShadow = true;
  scene.add(dirLight);
  
  // Events
  renderer.domElement.addEventListener('click', lockPointer);
  document.addEventListener('pointerlockchange', lockChange);
  document.addEventListener('mousemove', mouseMove);
  window.addEventListener('resize', onResize);
}

let rotX = 0, rotY = 0;
function mouseMove(e) {
  if (!pointerLocked) return;
  rotY -= e.movementX * 0.002;
  rotX -= e.movementY * 0.002;
  rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
  camera.rotation.order = 'YXZ';
  camera.rotation.y = rotY;
  camera.rotation.x = rotX;
}

function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function createEnemy(x, z, color) {
  const group = new THREE.Group();
  const bodyGeo = new THREE.CapsuleGeometry(1,2.5,4,8);
  const bodyMat = new THREE.MeshLambertMaterial({color, emissive:color, emissiveIntensity:0.3});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.5;
  body.castShadow = true;
  group.add(body);
  
  const headGeo = new THREE.SphereGeometry(0.8);
  const headMat = new THREE.MeshLambertMaterial({color, emissive:color, emissiveIntensity:0.5});
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 3.2;
  group.add(head);
  
  group.position.set(x, 0, z);
  group.userData.alive = true;
  scene.add(group);
  return group;
}

function spawnWave() {
  humanoidMeshes.forEach(m => scene.remove(m));
  humanoidMeshes = [];
  console.log(`🌊 WAVE ${wave} (${gameMode.toUpperCase()})`);
  
  currentSpeed = modes[gameMode].speed;
  currentColor = modes[gameMode].color;
  
  for (let i = 0; i < 10; i++) {
    const angle = (i/10)*Math.PI*2 + Math.random()*0.5;
    const x = Math.cos(angle)*spawnRadius;
    const z = Math.sin(angle)*spawnRadius;
    humanoidMeshes.push(createEnemy(x, z, currentColor));
  }
}

document.addEventListener('click', e => {
  if (!pointerLocked || e.button !== 0 || !gameActive) return;
  
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = ray.intersectObjects(scene.children, true);
  
  for (let hit of hits) {
    const enemy = hit.object.parent;
    if (enemy?.userData?.alive) {
      enemy.userData.alive = false;
      kills++;
      console.log(`KILL ${kills}`);
      enemy.scale.setScalar(1.5);
      let s = 1.5;
      const explode = () => {
        s *= 1.15;
        enemy.scale.setScalar(s);
        if (s > 4) scene.remove(enemy);
        else requestAnimationFrame(explode);
      };
      explode();
      updateUI();
      break;
    }
  }
});

function animate() {
  requestAnimationFrame(animate);
  
  if (gameActive) {
    humanoidMeshes = humanoidMeshes.filter(enemy => {
      if (!enemy.userData.alive) return false;
      
      const dir = new THREE.Vector3(-enemy.position.x,0,-enemy.position.z).normalize();
      enemy.position.add(dir.multiplyScalar(currentSpeed));
      enemy.rotation.y = Math.atan2(enemy.position.x, enemy.position.z) + Math.PI;
      
      if (enemy.position.distanceTo(camera.position) < reachDistance) {
        console.log(`GAME OVER - Wave ${wave-1} survived`);
        gameActive = false;
        const wavesSurvived = wave - 1;
        maxWave = Math.max(maxWave, wavesSurvived);
        if (gameMode === 'ranked') submitScore('arena-ranked', wavesSurvived);
        showGameOver(wavesSurvived);
        return false;
      }
      return true;
    });
    
    if (humanoidMeshes.length === 0 && gameActive) {
      wave++;
      spawnWave();
    }
  }
  
  renderer.render(scene, camera);
}
</script>
</body>
</html>
