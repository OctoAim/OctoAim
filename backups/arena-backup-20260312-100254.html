<!DOCTYPE html>
<html>
<head>
<title>3D Arena - Aim Trainer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
body { margin: 0; overflow: hidden; background: #111; font-family: Arial; color: white; cursor: crosshair; }
#hud { position: absolute; top: 10px; left: 10px; z-index: 100; }
#menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 200; }
#menu.hidden { display: none; }
button { padding: 15px 30px; font-size: 20px; margin: 10px; background: #00ff88; color: black; border: none; border-radius: 10px; cursor: pointer; }
#gameover { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 150; display: none; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; max-width: 90%; max-height: 90%; overflow-y: auto; }
.leaderboard { max-height: 300px; overflow-y: auto; margin: 20px 0; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; }
.lb-row { padding: 8px; border-bottom: 1px solid #444; font-size: 14px; }
.lb-row.me { background: #00ff88; color: black; font-weight: bold; }
.stats { display: flex; gap: 30px; margin: 20px 0; justify-content: center; flex-wrap: wrap; }
.stat { text-align: center; min-width: 100px; }
.stat-value { font-size: 28px; font-weight: bold; }
.difficulty { font-size: 20px; color: #00ff88; margin-bottom: 20px; padding: 10px; background: rgba(0,255,136,0.1); border-radius: 8px; }
</style>
</head>
<body>
<div id="hud">
  <div>Wave: <span id="wave">1</span> | Kills: <span id="kills">0</span> | Survived: <span id="survived">0</span>s</div>
  <div id="difficulty-display" class="difficulty"></div>
</div>
<div id="menu">
  <h1>🎯 3D ARENA SURVIVAL</h1>
  <p>Click humanoids before they reach the center!</p>
  <div style="display: flex; flex-direction: column; gap: 15px;">
    <button onclick="startGame('easy')">🟢 EASY<br><small>5 enemies, slow speed</small></button>
    <button onclick="startGame('medium')">🟡 MEDIUM<br><small>8 enemies, medium speed</small></button>
    <button onclick="startGame('hard')">🔴 HARD<br><small>12 enemies, fast speed<br>🏆 Waves Leaderboard</small></button>
  </div>
</div>
<div id="gameover">
  <h1 id="gameover-title">GAME OVER</h1>
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="final-wave">0</div>
      <div>Waves Survived</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="final-kills">0</div>
      <div>Total Kills</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="final-survived">0</div>
      <div>Survival Time</div>
    </div>
  </div>
  <div id="hard-leaderboard" class="leaderboard" style="display:none;">
    <h4>🏆 Arena Waves Leaderboard</h4>
    <div id="lb-list"></div>
  </div>
  <div>
    <button onclick="location.reload()" style="font-size: 18px; padding: 12px 24px;">🔄 Play Again</button>
  </div>
</div>

<script>
// Game state
let scene, camera, renderer, humanoidMeshes = [];
let gameStarted = false, currentDifficulty = '', gameConfig = {};
let wave = 1, kills = 0, startTime = 0, spawnRadius = 12;
const reachDistance = 1.5;

// Difficulty configs
const difficulties = {
  easy: { enemiesPerWave: 5, baseSpeed: 0.08, color: 0x88ff88 },
  medium: { enemiesPerWave: 8, baseSpeed: 0.12, color: 0xffff88 },
  hard: { enemiesPerWave: 12, baseSpeed: 0.15, color: 0xff8888 }
};

// Firebase vars
let db = null, firebaseReady = false, currentUserId = null, currentUsername = null;

// Init 3D scene
function init3D() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x111111, 10, 50);
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(1, 1, 1);
  scene.add(dirLight);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x111111);
  document.body.appendChild(renderer.domElement);

  window.addEventListener('click', onClick);
  window.addEventListener('resize', onResize);
}

// Resize handler
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Create detailed humanoid
function createHumanoid(x, z, color = 0xff4444) {
  const group = new THREE.Group();

  // Body capsule
  const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.5, 4, 8);
  const bodyMat = new THREE.MeshPhongMaterial({ color });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1;
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.4);
  const headMat = new THREE.MeshPhongMaterial({ color: new THREE.Color(color).multiplyScalar(1.3) });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 2.2;
  group.add(head);

  // Glowing eyes
  const eyeGeo = new THREE.SphereGeometry(0.08);
  const eyeMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x444444 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.2, 2.25, 0.35);
  group.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.2, 2.25, 0.35);
  group.add(rightEye);

  // Arms
  const armGeo = new THREE.CapsuleGeometry(0.15, 1, 4, 8);
  const leftArm = new THREE.Mesh(armGeo, bodyMat);
  leftArm.position.set(-0.8, 1, 0);
  leftArm.rotation.z = 0.3;
  group.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, bodyMat);
  rightArm.position.set(0.8, 1, 0);
  rightArm.rotation.z = -0.3;
  group.add(rightArm);

  // Legs
  const legGeo = new THREE.CapsuleGeometry(0.2, 1.2, 4, 8);
  const leftLeg = new THREE.Mesh(legGeo, bodyMat);
  leftLeg.position.set(-0.3, -0.6, 0);
  group.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, bodyMat);
  rightLeg.position.set(0.3, -0.6, 0);
  group.add(rightLeg);

  group.position.set(x, 0, z);
  group.userData = { alive: true };
  scene.add(group);
  return group;
}

// Spawn wave - RANDOM angles at fixed radius
function spawnWave() {
  const enemiesThisWave = Math.floor(gameConfig.enemiesPerWave + (wave - 1) * 0.5);
  spawnRadius = Math.max(8, spawnRadius - 0.1); // Gradually shrink
  
  for (let i = 0; i < enemiesThisWave; i++) {
    const angle = Math.random() * Math.PI * 2; // TRUE RANDOM!
    const x = Math.cos(angle) * spawnRadius;
    const z = Math.sin(angle) * spawnRadius;
    humanoidMeshes.push(createHumanoid(x, z, gameConfig.color));
  }
  
  document.getElementById('wave').textContent = wave;
  playSound?.('success'); // Wave spawn sound
}

// Click handler - raycast kill
function onClick(event) {
  if (!gameStarted) return;

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(scene.children, true);

  for (let intersect of intersects) {
    const mesh = intersect.object.parent;
    if (mesh.userData?.alive) {
      mesh.userData.alive = false;
      kills++;
      document.getElementById('kills').textContent = kills;
      
      // Kill effect: scale + fade
      mesh.scale.multiplyScalar(1.3);
      const killTween = () => {
        mesh.scale.multiplyScalar(1.05);
        if (mesh.scale.x > 2.5) {
          scene.remove(mesh);
        } else {
          requestAnimationFrame(killTween);
        }
      };
      killTween();
      
      playSound?.('hit');
      break;
    }
  }
}

// Main update loop
function update() {
  if (!gameStarted) return;

  // HUD update
  const survived = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('survived').textContent = survived + 's';

  // Slow camera rotation
  camera.rotation.y += 0.003;

  // Update humanoids
  humanoidMeshes = humanoidMeshes.filter(mesh => {
    if (!mesh.userData.alive) {
      scene.remove(mesh);
      return false;
    }

    // Move toward center (player)
    const dir = new THREE.Vector3(-mesh.position.x, 0, -mesh.position.z).normalize();
    mesh.position.add(dir.multiplyScalar(gameConfig.speed));

    // Face player
    mesh.rotation.y = Math.atan2(mesh.position.x, mesh.position.z) + Math.PI;

    // Walk animations
    const time = Date.now() * 0.01;
    if (mesh.children[4]) mesh.children[4].rotation.x = Math.sin(time) * 0.3; // left arm
    if (mesh.children[5]) mesh.children[5].rotation.x = -Math.sin(time) * 0.3; // right arm
    mesh.position.y = Math.sin(time * 3) * 0.05; // bob

    // Collision check
    if (mesh.position.distanceTo(new THREE.Vector3()) < reachDistance) {
      gameOver();
      return false;
    }
    
    return true;
  });

  // Check for wave completion
  if (humanoidMeshes.length === 0 && gameStarted) {
    wave++;
    spawnWave();
  }
}

// Start game with difficulty
async function startGame(difficulty) {
  currentDifficulty = difficulty;
  gameConfig = difficulties[difficulty];
  gameStarted = true;
  wave = 1;
  kills = 0;
  humanoidMeshes = [];
  startTime = Date.now();
  spawnRadius = 12;

  // Reset HUD
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('difficulty-display').textContent = `${difficulty.toUpperCase()} MODE`;
  document.getElementById('wave').textContent = wave;
  document.getElementById('kills').textContent = kills;
  document.getElementById('survived').textContent = '0s';

  playSound?.('gameStart');

  // Init Firebase for hard mode leaderboard
  if (difficulty === 'hard') {
    firebaseReady = await initFirebaseLeaderboard();
  }

  spawnWave();
}

// Game over
async function gameOver() {
  gameStarted = false;
  const survived = Math.floor((Date.now() - startTime) / 1000);

  // Update final stats
  document.getElementById('final-wave').textContent = wave - 1;
  document.getElementById('final-kills').textContent = kills;
  document.getElementById('final-survived').textContent = survived + 's';
  document.getElementById('gameover').style.display = 'block';
  document.getElementById('gameover-title').textContent = '💀 GAME OVER';

  playSound?.('gameEnd');

  // HARD MODE: Submit score and show leaderboard
  if (currentDifficulty === 'hard' && firebaseReady) {
    const finalWaves = wave - 1;
    const submitted = await submitScore('arena', finalWaves);
    if (submitted) {
      const topScores = await getTopScores('arena', 10);
      const lbList = document.getElementById('lb-list');
      let lbHtml = '';
      topScores.forEach(entry => {
        const rowClass = entry.isMe ? 'lb-row me' : 'lb-row';
        lbHtml += `<div class="${rowClass}">
          ${entry.rank === 1 ? '🥇' : entry.rank === 2 ? '🥈' : entry.rank === 3 ? '🥉' : '#' + entry.rank}
          ${entry.username}: ${entry.score} waves
        </div>`;
      });
      if (topScores.length === 0) lbHtml = '<div style="color:#888; text-align:center;">Be the first on the leaderboard!</div>';
      lbList.innerHTML = lbHtml;
      document.getElementById('hard-leaderboard').style.display = 'block';
    }
  }
}

// ============ FIREBASE LEADERBOARD ============
async function initFirebaseLeaderboard() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js");
    const { getFirestore, collection, addDoc, query, orderBy, limit, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js");
    
    const firebaseConfig = {
        apiKey: "AIzaSyBLnHaXUJsxsimqH1o6KJ8TEEGqRQ0Wcak",
        authDomain: "octoaim.firebaseapp.com",
        projectId: "octoaim",
        storageBucket: "octoaim.firebasestorage.app",
        messagingSenderId: "629745818659",
        appId: "1:629745818659:web:eb0f7be2f095dd0284a596"
    };
    
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    
    currentUserId = localStorage.getItem('aimtrainer_userid') || ('user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now());
    localStorage.setItem('aimtrainer_userid', currentUserId);
    currentUsername = localStorage.getItem('aimtrainer_username') || 'Anonymous Player';
    
    return true;
  } catch (e) {
    console.error('Firebase init failed:', e);
    return false;
  }
}

async function submitScore(gameId, score) {
  try {
    const { collection, addDoc } = await import("https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js");
    await addDoc(collection(db, 'leaderboard'), {
      gameId,
      score: parseInt(score),
      userId: currentUserId,
      username: currentUsername,
      timestamp: Date.now(),
      difficulty: 'hard'
    });
    console.log(`✅ Submitted ${score} waves to Arena leaderboard`);
    return true;
  } catch (e) {
    console.error('Score submit failed:', e);
    return false;
  }
}

async function getTopScores(gameId, count = 10) {
  try {
    const { collection, query, orderBy, limit, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js");
    const q = query(
      collection(db, 'leaderboard'),
      where('gameId', '==', gameId),
      orderBy('score', 'desc'),
      limit(count)
    );
    const snapshot = await getDocs(q);
    
    const results = [];
    let rank = 1;
    snapshot.forEach((doc) => {
      const data = doc.data();
      results.push({
        rank: rank++,
        username: data.username || 'Anonymous',
        score: data.score,
        isMe: data.userId === currentUserId
      });
    });
    return results;
  } catch (e) {
    console.error('Leaderboard fetch failed:', e);
    return [];
  }
}

// Sound placeholder (overridden by sound-system.js)
function playSound(soundName) {
  console.log(`🔊 ${soundName}`);
}

// Init everything
init3D();
update();

// Add render/animate loop always
function render() {
  if (renderer) {
    renderer.render(scene, camera);
  }
  requestAnimationFrame(render);
}
render();

// Load systems AFTER init
setTimeout(() => {
  if (typeof initAudio === 'function') initAudio();
  if (typeof initCrosshair === 'function') initCrosshair();
}, 100);
</script>
<script src="sound-system.js"></script>
<script src="crosshair-system.js"></script>
<script src="firebase-leaderboard.js"></script>
</body>
</html>
