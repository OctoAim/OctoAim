<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Run - Mini Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0f; user-select: none; }
        #game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
        #hud { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; z-index: 100; }
        .hud-item { background: rgba(0,0,0,0.8); border: 2px solid #ff4444; border-radius: 12px; padding: 15px 30px; text-align: center; }
        .hud-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { color: #ff4444; font-size: 36px; font-weight: bold; }
        #start-screen, #end-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        #end-screen { display: none; }
        h1 { color: #ff4444; font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 30px #ff4444; }
        .subtitle { color: #888; font-size: 18px; margin-bottom: 40px; }
        .btn { padding: 18px 50px; font-size: 20px; background: #ff4444; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff4444; }
        .result-score { color: #fff; font-size: 72px; font-weight: bold; margin: 20px 0; }
        .result-label { color: #888; font-size: 18px; }
        .new-record { color: #ffaa00; font-size: 24px; margin-top: 10px; }
        .home-btn { position: fixed; top: 20px; right: 20px; padding: 12px 24px; background: linear-gradient(145deg, #1a1a2e, #0f0f1a); border: 2px solid #ff4444; border-radius: 8px; color: #ff4444; font-size: 14px; font-weight: bold; cursor: pointer; z-index: 300; transition: all 0.3s; }
        .home-btn:hover { background: #ff4444; color: #000; }
    </style>
</head>
<body>
    <button class="home-btn" onclick="goHome()">🏠 HOME</button>
    <canvas id="game-canvas"></canvas>
    <div id="hud">
        <div class="hud-item">
            <div class="hud-label">Time</div>
            <div class="hud-value" id="timer">0.0s</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Targets</div>
            <div class="hud-value" id="targets">0/50</div>
        </div>
    </div>
    <div id="start-screen">
        <h1>⚡ SPEED RUN</h1>
        <p class="subtitle">Complete 50 targets as fast as you can!</p>
        <button class="btn" onclick="startGame()">START</button>
    </div>
    <div id="end-screen">
        <h1>COMPLETE!</h1>
        <div class="result-label">Your Time</div>
        <div class="result-score" id="final-time">0s</div>
        <div class="new-record" id="record-msg" style="display: none;">🎉 NEW RECORD!</div>
        <button class="btn" onclick="restartGame()" style="margin-top: 30px;">PLAY AGAIN</button>
    </div>
    <script src="sound-system.js"></script>
    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, gameRunning = false, targetsHit = 0, maxTargets = 50, startTime = 0, target = null, timerInterval = null;
        
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        
        function spawnTarget() {
            const size = 40 + Math.random() * 20;
            target = { x: size/2 + Math.random() * (width - size), y: 100 + Math.random() * (height - 200), size: size, color: '#ff4444' };
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(255,68,68,0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
            for (let y = 0; y < height; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
            if (target) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff4444';
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.size/2, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4444';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.size/4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            if (gameRunning) {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timer').textContent = elapsed + 's';
                requestAnimationFrame(draw);
            }
        }
        
        function startGame() {
            initAudio(); playSound('gameStart');
            document.getElementById('start-screen').style.display = 'none';
            gameRunning = true; targetsHit = 0;
            startTime = Date.now();
            document.getElementById('targets').textContent = '0/' + maxTargets;
            spawnTarget(); draw();
        }
        
        function endGame() {
            gameRunning = false;
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(1);
            playSound('gameEnd');
            const best = parseFloat(localStorage.getItem('aimtrainer_mini_speedrun') || '9999');
            const recordMsg = document.getElementById('record-msg');
            if (parseFloat(finalTime) < best) {
                localStorage.setItem('aimtrainer_mini_speedrun', finalTime);
                recordMsg.style.display = 'block';
                playSound('newRecord');
            } else {
                recordMsg.style.display = 'none';
            }
            document.getElementById('final-time').textContent = finalTime + 's';
            document.getElementById('end-screen').style.display = 'flex';
        }
        
        function restartGame() { document.getElementById('end-screen').style.display = 'none'; startGame(); }
        function goHome() { window.location.href = 'index.html'; }
        
        canvas.addEventListener('click', (e) => {
            if (!gameRunning || !target) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const dist = Math.sqrt((x - target.x) ** 2 + (y - target.y) ** 2);
            if (dist < target.size/2 + 10) {
                targetsHit++; playHitSound();
                document.getElementById('targets').textContent = targetsHit + '/' + maxTargets;
                if (targetsHit >= maxTargets) endGame();
                else spawnTarget();
            } else {
                playMissSound();
            }
        });
    </script>
</body>
</html>
